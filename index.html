<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Block Blast MVP</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div>
          <h1>Block Blast MVP</h1>
          <p class="subtitle">
            Drag pieces onto the 8x8 board. Fill rows or columns to clear and score.
          </p>
        </div>
        <div class="hud">
          <div class="score-card">
            <span>Score</span>
            <strong id="score">0</strong>
          </div>
          <div class="score-card">
            <span>Best</span>
            <strong id="best-score">0</strong>
          </div>
          <label class="toggle-card" for="planner-clears-toggle">
            <span>Generator Clears</span>
            <input id="planner-clears-toggle" type="checkbox" />
          </label>
          <label class="toggle-card" for="designated-spot-toggle">
            <span>Designated Spot</span>
            <input id="designated-spot-toggle" type="checkbox" />
          </label>
          <label class="input-card" for="perfect-fit-chance-input">
            <span>Perfect Fit Chance</span>
            <input id="perfect-fit-chance-input" type="number" min="0" max="1" step="0.05" />
          </label>
          <label class="input-card" for="min-perfect-fit-input">
            <span>Min Perfect Fit</span>
            <input id="min-perfect-fit-input" type="number" min="0" max="1" step="0.05" />
          </label>
          <label class="input-card" for="min-cells-filled-input">
            <span>Min Cells Filled</span>
            <input id="min-cells-filled-input" type="number" min="0" max="1" step="0.05" />
          </label>
          <button id="shape-bank-btn" class="btn">Shape Bank</button>
          <button id="restart-btn" class="btn">Restart</button>
        </div>
      </header>

      <section class="game-area">
        <div id="board" class="board" aria-label="8 by 8 game board"></div>
        <div id="overlay" class="overlay hidden">
          <h2>Game Over</h2>
          <p id="final-score-text">Final Score: 0</p>
          <button id="play-again-btn" class="btn">Play Again</button>
        </div>
      </section>

      <section class="tray-section">
        <h2>Pieces</h2>
        <div id="tray" class="tray" aria-label="Available pieces"></div>
      </section>
    </main>

    <div id="shape-bank-modal" class="modal hidden" role="dialog" aria-modal="true">
      <section class="modal-panel">
        <header class="modal-header">
          <h2>Shape Bank</h2>
          <button id="shape-bank-close-btn" class="btn">Close</button>
        </header>
        <p class="modal-subtitle">
          Toggle shapes on/off. Disabled shapes will never be generated.
        </p>
        <div id="shape-bank-grid" class="shape-bank-grid"></div>
      </section>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
